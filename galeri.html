<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
    <meta name="theme-color" content="#f3eee4">
    <title>Galeri — Alyssa Ananta</title>
    
    <link rel="stylesheet" href="style.css">
 
    <style>
        .galeri { max-width: 1100px; margin: 0 auto; padding: 20px 4vw 80px; position: relative; z-index: 2; }

        /* --- Desain Container Buku --- */
        .book-container {
            position: relative; max-width: 1000px; margin: 0 auto;
            perspective: 3000px; 
        }

        /* --- Cover Buku (Tampilan Awal) --- */
        .book-cover {
            position: absolute; inset: 0; z-index: 20;
            background: var(--dk);
            border-radius: 20px; border: 3px solid var(--ink);
            box-shadow: 10px 10px 0 var(--blue), inset 0 0 50px rgba(0,0,0,0.5);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 1s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.8s ease;
            transform-origin: left center; cursor: pointer; overflow: hidden;
        }
        .book-cover::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 15px;
            background: linear-gradient(90deg, rgba(0,0,0,0.8), transparent);
            border-right: 1px solid rgba(255,255,255,0.05);
        }
        .book-cover.open {
            transform: rotateY(-180deg); opacity: 0; pointer-events: none;
        }
        .cover-content {
            text-align: center; padding: 40px; z-index: 2;
        }
        .cover-title {
            font-family: var(--disp, sans-serif); font-size: 3.5rem; font-weight: 800; line-height: 1.1;
            background: var(--grad-1, linear-gradient(120deg, #8b5cf6, #ec4899));
            -webkit-background-clip: text; background-clip: text; color: transparent;
            margin-bottom: 10px; filter: drop-shadow(0 0 20px rgba(236,72,153,0.4));
        }
        .cover-subtitle {
            font-family: var(--mono, monospace); color: #cfc9bb; font-size: 1rem;
            letter-spacing: 2px; text-transform: uppercase; margin-bottom: 30px;
        }
        .cover-btn {
            background: rgba(255,255,255,0.05); border: 1px solid var(--magenta, #ec4899);
            color: #fff; padding: 12px 30px; border-radius: 99px; font-family: var(--disp);
            font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s;
            display: inline-flex; align-items: center; gap: 10px;
        }
        .cover-btn:hover { background: var(--magenta, #ec4899); box-shadow: 0 0 30px rgba(236,72,153,0.6); }

        /* --- Buku Terbuka --- */
        .book {
            position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 0;
            border-radius: 20px; overflow: hidden; min-height: 550px;
            border: 3px solid var(--ink); box-shadow: 10px 10px 0 var(--blue);
            background: var(--dk); opacity: 0; transition: opacity 0.5s ease 0.5s;
        }
        .book.show { opacity: 1; }

        /* Garis Lipatan Tengah Buku */
        .book::before {
            content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 60px;
            transform: translateX(-50%); z-index: 4; pointer-events: none;
            background: linear-gradient(90deg, transparent, rgba(0,0,0,0.6) 45%, rgba(0,0,0,0.8) 50%, rgba(0,0,0,0.6) 55%, transparent);
        }

        .spread { display: contents; }

        /* Halaman Buku */
        .pg {
            position: relative; padding: 25px; display: flex; flex-direction: column;
            background: linear-gradient(180deg, rgba(255,255,255,0.02), transparent);
            transition: transform 0.6s ease, opacity 0.6s ease; transform-style: preserve-3d;
            border-right: 1px solid rgba(255,255,255,0.03);
        }
        .pg-l { transform-origin: right center; }
        .pg-r { transform-origin: left center; }
        
        /* Animasi Lipat Kertas */
        .pg.fold { transform: rotateY(-160deg); opacity: 0; }
        .pg-r.fold { transform: rotateY(160deg); }
        .pg.pre { transform: rotateY(-160deg); opacity: 0; transition: none; }

        /* Header Tempat (Kiri Atas halaman) */
        .pg-header {
            margin-bottom: 15px; padding-bottom: 10px;
            border-bottom: 1px dashed rgba(255,255,255,0.15);
            display: flex; justify-content: space-between; align-items: flex-end;
        }
        .pg-header h3 {
            font-family: var(--disp, sans-serif); font-size: 1.5rem; font-weight: 800; line-height: 1;
            color: #fff; margin: 0;
        }
        .pg-header { align-items: center; gap: 12px; }
        .pg-header h3 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
        .pg-header .year { flex-shrink: 0; }
        .pg-header .year {
            font-family: var(--mono, monospace); font-size: 0.8rem; color: var(--magenta, #ec4899);
            background: rgba(236,72,153,0.1); padding: 2px 8px; border-radius: 4px;
        }

        /* Grid Foto */
        .photo-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 12px; flex: 1;
        }
        
        /* Kartu Foto */
        .photo {
            position: relative; overflow: hidden; border-radius: 8px;
            border: 3px solid #fff; cursor: pointer; margin: 0; aspect-ratio: 1;
            background: #000; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: all 0.3s ease; transform: rotate(var(--rot, 0deg));
        }
        .photo:hover { transform: rotate(0deg) scale(1.05); z-index: 10; border-color: var(--magenta, #ec4899); }
        .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 25%; }
        .photo figcaption {
            position: absolute; bottom: 0; left: 0; right: 0; padding: 15px 8px 6px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            color: #fff; font-size: 0.7rem; text-align: center;
        }

        /* Halaman Kosong */
        .empty-page {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100%; opacity: 0.3; font-family: var(--disp); font-size: 1.2rem;
            letter-spacing: 2px; text-transform: uppercase; color: #fff;
        }

        /* Nomor Halaman */
        .pno { position: absolute; bottom: 15px; font-family: var(--mono, monospace); font-size: 0.7rem; color: var(--tx3, #686880); }
        .pg-l .pno { left: 25px; }
        .pg-r .pno { right: 25px; }

        /* --- Kontrol Navigasi --- */
        .book-ctrl { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: 30px; opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }
        .book-ctrl.show { opacity: 1; pointer-events: auto; }
        .flip {
            width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--ink);
            background: var(--paper); color: var(--ink); box-shadow: 3px 3px 0 var(--ink); font-size: 1.2rem; cursor: pointer;
            transition: all 0.3s ease; display: grid; place-items: center;
        }
        .flip:hover:not(:disabled) { background: var(--yellow); transform: translate(-2px,-2px) scale(1.1); }
        .flip:disabled { opacity: 0.2; cursor: not-allowed; }
        #pageInfo { font-family: var(--mono, monospace); font-size: 0.9rem; color: var(--ink); text-align: center; min-width: 180px; }

        /* --- Responsif Mobile --- */
        @media (max-width: 820px) {
            .book { grid-template-columns: 1fr; min-height: auto; }
            .book::before { display: none; }
            .pg { padding: 20px; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05); }
            .pg-header h3 { font-size: 1.3rem; }
            .pno { position: static; margin-top: 15px; text-align: center; }
            .cover-title { font-size: 2.2rem; }
        }
    </style>
</head>

<!-- ============================================================
     EDIT FOTO DI SINI SAJA
     Satu blok { } = satu album (satu kelompok halaman).
       keterangan : tulisan di atas halaman (nama tempat / keterangan, satu baris)
       tahun      : tahun album
       foto       : daftar nama file saja, otomatis diambil dari folder foto/
     Mau tambah foto  -> tambah satu baris "fotoX.jpeg",
     Mau tambah album -> salin satu blok { ... } lalu ubah isinya.
============================================================ -->
<script>
const ALBUM = [
  { keterangan: "Thailand", tahun: "2025", foto: [
      "galeri/T1.jpg",
      "galeri/T2.jpg",
      "galeri/T3.jpg",
      "galeri/T4.jpg",

      "galeri/C8.jpg",
  ]},
  { keterangan: "Arab Saudi", tahun: "2026", foto: [
      "galeri/U1.jpg",
      "galeri/U2.jpg",
      "galeri/U3.jpg",
      "galeri/U4.jpg",

  ]},
  { keterangan: "Ternate", tahun: "2026", foto: [
      "galeri/Tr1.jpg",
      "galeri/Tr2.jpg",
      "galeri/Tr3.jpg",
      "galeri/Tr4.jpg",
      "galeri/Tr5.jpg",
      "galeri/Tr6.jpg",
      "galeri/Tr7.jpg",
      "galeri/Tr8.jpg",
  ]},
];
</script>

<section class="galeri">
    <!-- Container Buku (Hanya ada 1 buku besar) -->
    <div class="book-container">
        
        <!-- Cover Depan -->
        <div class="book-cover" id="bookCover">
            <div class="cover-content">
                <div class="cover-subtitle">Album Foto</div>
                <div class="cover-title" id="coverTitle">Alyssa Ananta</div>
                <button class="cover-btn" id="openBtn">
                    <span>Buka Album</span> <span>→</span>
                </button>
            </div>
        </div>

        <!-- Isi Buku -->
        <div class="book" id="book" aria-live="polite">
            <div class="spread" id="spread"></div>
        </div>
    </div>
    
    <!-- Navigasi Bawah -->
    <div class="book-ctrl" id="bookCtrl">
        <button class="flip" id="prev" aria-label="Halaman sebelumnya">←</button>
        <span id="pageInfo"></span>
        <button class="flip" id="next" aria-label="Halaman berikutnya">→</button>
    </div>
</section>

<!-- Lightbox Zoom Foto -->
<div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lbClose" aria-label="Tutup">✕</button>
    <img src="" alt="" id="lbImg">
</div>

<footer>© 2026 Shiro</footer>

<script>
    const $ = id => document.getElementById(id);
    
    // Preloader & Navbar
    addEventListener('load', () => setTimeout(() => $('preloader').classList.add('hidden'), 900));
    $('menuToggle').onclick = () => { $('menuToggle').classList.toggle('active'); $('navMenu').classList.toggle('active'); };
    
    // Scroll Progress
    addEventListener('scroll', () => {
        $('scrollProgress').style.width = scrollY / (document.body.scrollHeight - innerHeight) * 100 + '%';
        $('navbar').classList.toggle('scrolled', scrollY > 60);
    }, { passive: true });
    
    // Kursor Kustom
    if (matchMedia('(hover:hover)').matches) {
        let mx = 0, my = 0, rx = 0, ry = 0;
        addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; $('cursorDot').style.left = mx + 'px'; $('cursorDot').style.top = my + 'px'; });
        (function a() { rx += (mx - rx) * .15; ry += (my - ry) * .15; $('cursorRing').style.left = rx + 'px'; $('cursorRing').style.top = ry + 'px'; requestAnimationFrame(a); })();
        document.addEventListener('mouseover', e => $('cursorRing').classList.toggle('hover', !!e.target.closest('a,button,.photo,.book-cover')));
    }

    // ===== LOGIKA BUKU ALBUM (Satu Buku Besar) =====
    let ai = 0; // Indeks Album/Tempat saat ini
    let sp = 0; // Indeks Spread (Halaman buka)
    let busy = false;
    let isOpen = false; // Status buku terbuka atau tertutup
    const rots = [-1.5, 1, -1, 2];

    // Bagi tiap album menjadi halaman berisi maks. 4 foto (2x2)
    function pages() {
        const p = [];
        ALBUM.forEach(a => {
            const list = a.foto.map(file => ({ src: 'foto/' + file }));
            for (let i = 0; i < list.length; i += 4) {
                p.push({ title: a.keterangan, year: a.tahun, photos: list.slice(i, i + 4) });
            }
        });
        if (p.length % 2 !== 0) p.push({ end: true });
        return p;
    }

    // Render Konten Halaman
    function pageHTML(pg, n, side) {
        let h = '';
        
        if (pg.photos) {
            h += `
                <div class="pg-header">
                    <h3>${pg.title}</h3>
                    <div class="year">${pg.year}</div>
                </div>
            `;
            
            h += `<div class="photo-grid">`;
            h += pg.photos.map((f, i) => `
                <figure class="photo" style="--rot:${rots[(n + i) % 4]}deg">
                    <img src="${f.src}" alt="${pg.title}" loading="lazy">
                </figure>
            `).join('');
            h += `</div>`;

        } else {
            // Halaman kosong
            h = `<div class="empty-page">📷<br><br>...</div>`;
        }
        
        return `<div class="pg ${side}">${h}<span class="pno">${n}</span></div>`;
    }

    // Render Buku
    function render() {
        const p = pages();
        $('spread').innerHTML = pageHTML(p[sp * 2], sp * 2 + 1, 'pg-l') + pageHTML(p[sp * 2 + 1], sp * 2 + 2, 'pg-r');
        
        const total = p.length / 2;
        // Keterangan halaman di bawah: Gabungan nama tempat
        $('pageInfo').textContent = `Halaman ${sp + 1} dari ${total}`;
        $('prev').disabled = sp === 0;
        $('next').disabled = sp === total - 1;
    }

    // Animasi Lipat Halaman
    function turn(dir, after) {
        if (busy) return; busy = true;
        const out = document.querySelector(dir > 0 ? '.pg-r' : '.pg-l');
        out.classList.add('fold');
        
        setTimeout(() => {
            after(); render();
            const inn = document.querySelector(dir > 0 ? '.pg-l' : '.pg-r');
            inn.classList.add('pre', 'pg');
            requestAnimationFrame(() => requestAnimationFrame(() => { 
                inn.classList.remove('pre'); 
                setTimeout(() => busy = false, 380); 
            }));
        }, 380);
    }

    // Navigasi Halaman (Next / Prev)
    function go(d) {
        if (!isOpen) return;
        const total = pages().length / 2;
        if (d > 0 && sp < total - 1) {
            turn(1, () => { sp++; });
        } else if (d < 0 && sp > 0) {
            turn(-1, () => { sp--; });
        }
    }

    $('next').onclick = () => go(1);
    $('prev').onclick = () => go(-1);
    
    // Fitur Buka Buku
    $('bookCover').onclick = () => {
        $('bookCover').classList.add('open');
        $('book').classList.add('show');
        $('bookCtrl').classList.add('show');
        isOpen = true;
    };

    // Keyboard & Swipe (Geser di HP)
    addEventListener('keydown', e => { 
        if (e.key === 'ArrowRight' && !$('next').disabled && !document.querySelector('.lightbox.active')) go(1);
        if (e.key === 'ArrowLeft' && !$('prev').disabled && !document.querySelector('.lightbox.active')) go(-1); 
    });
    
    // Klik buku: separuh kanan = halaman berikutnya, separuh kiri = sebelumnya
    $('book').addEventListener('click', e => {
        if (!isOpen || e.target.closest('.photo')) return;
        const r = $('book').getBoundingClientRect();
        go(e.clientX > r.left + r.width / 2 ? 1 : -1);
    });

    let sx = 0;
    $('book').addEventListener('touchstart', e => sx = e.touches[0].clientX, { passive: true });
    $('book').addEventListener('touchend', e => { 
        const d = e.changedTouches[0].clientX - sx;
        if (Math.abs(d) > 60) { 
            if (d < 0 && !$('next').disabled) go(1); 
            if (d > 0 && !$('prev').disabled) go(-1); 
        } 
    });

    // Lightbox Zoom Foto
    const lb = $('lightbox');
    document.addEventListener('click', e => { 
        const p = e.target.closest('.photo'); 
        if (p) { $('lbImg').src = p.querySelector('img').src; lb.classList.add('active'); document.body.style.overflow = 'hidden'; } 
    });
    lb.addEventListener('click', e => { 
        if (e.target === lb || e.target.closest('#lbClose')) { lb.classList.remove('active'); document.body.style.overflow = ''; } 
    });
    addEventListener('keydown', e => { 
        if (e.key === 'Escape') { lb.classList.remove('active'); document.body.style.overflow = ''; } 
    });

    // Inisialisasi awal
    render();
</script>
